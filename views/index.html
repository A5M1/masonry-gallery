<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/jquery.fancybox.css" type="text/css" />
    <link rel="stylesheet" href="/css/galleria.css" type="text/css" />
    <script src="/bundled"></script>

</head>

<body>
    <button class="sidebar-toggle-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
    <!--[
        refactor functionality ->   <button class="scroll-to-top-btn" onclick="scrollToTopAndReset()">⬆️ Reset</button> 
    ]-->
    <div class="sidebar">
        <div class="sidebar-header"></div>
        <li class="folder-item" data-path="/">
            <span class="folder-spacer"></span>
            <a href="/" class="folder-link ">🏠<span class="folder-name">home</span></a>
        </li>
        <li class="folder-item" data-path="/">
            <span class="folder-spacer"></span>
            <a href="/mover?dir=/" class="folder-link ">📦<span class="folder-name">mover</span></a>
        </li>
        <div id="folder-tree-container"></div>
    </div>
    <div class="gallery-container">
        <div id="gallery" class="masonry" style="overflow: hidden">
            <div class="grid-sizer"></div>

        </div>
        <div id="loading" class="loading">Loading...</div>
    </div>
        <script src="/js/gallery.js"></script>
        <script>$(document).ready(function () { w(); m(); f(); v(); });</script>

        <script>(function () { var d=!1; try { var p=(location.protocol==='https:')?'wss://':'ws://'; var u=p+location.host+'/ws'; var s=new WebSocket(u); s.addEventListener('open',function(){ if(d)console.log('WS open',u) }); s.addEventListener('message',function(e){ try { var o=JSON.parse(e.data); if(o.type==='thumb_ready'&&o.media&&o.thumbUrl){ var i=document.querySelector('img[data-media="'+o.media+'"]'); if(i){ var c=i.getAttribute('src')||''; if(!c||c.indexOf('placeholder')!==-1||c.indexOf('base64')!==-1){ i.src=o.thumbUrl; if(o.thumbUrl.indexOf('-small.')!==-1)i.setAttribute('data-thumb-small',o.thumbUrl); if(o.thumbUrl.indexOf('-large.')!==-1)i.setAttribute('data-thumb-large',o.thumbUrl); var a=i.closest('a'); if(a)a.setAttribute('data-thumb-status','1') } } } if(d)console.log('WS',o) }catch(x){ console.error(x) } }); s.addEventListener('close',function(){ if(d)console.log('WS closed') }) }catch(x){ console.error('WS fail',x) } })()</script>
</body>

</html>
