<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Swipe Sorter</title>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6/dist/fancybox/fancybox.css" /> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6/dist/fancybox/fancybox.umd.js"></script>-->
    <!-- Uncomment above and comment below (fancybox will not be shipped in prod, if offline's required, download the following files and place  in `css\` and `js\` folders respectively)-->
    <!-- <link rel="stylesheet" href="/css/v6-fancybox.css" />-->
    <!-- <script src="/js/fancybox.umd.js"></script>-->
    
    <!-- umd is broken, using bundled jquery version of fancybox for now, will refactor later -->


    <link rel="stylesheet" href="/css/mover.css" />
    <link rel="stylesheet" href="/css/jquery.fancybox.css" />
    <script src="/bundled"></script>
    <script src="/js/mover.js"></script>

</head>
<body>
    <div id="main-container">
        <div id="left">
            <div class="sidebar-header">
                <h3 style="margin:0;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#aaa;">📁 Source</h3>
                <input id="folderSearch" type="text" placeholder="Search..." />
            </div>
            <div id="folderList"></div>
        </div>
        
        <div id="center">
            <div id="preview">Loading...</div>
            <div class="control-bar">
                <button onclick="goBack()" class="btn-back">← Back</button>
                <button onclick="reject()" class="btn-reject">✕ Reject</button>
                <button onclick="accept()" class="btn-accept">✓ Accept</button>
                <button onclick="showDeleteDialog()" class="btn-delete">🗑 Delete</button>
                <button onclick="showAddFolderDialog()" class="btn-add">+ Add Folder</button>
            </div>
        </div>
        
        <div id="right">
            <div class="sidebar-header">
                <h3 style="margin:0;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#aaa;">📁 Target</h3>
                <input id="targetSearch" type="text" placeholder="Search..." />
            </div>
            <div id="targetFolder"></div>
        </div>
    </div>
    
    <div id="addFolderModal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">New Folder</h2>
            <input id="folderName" class="modal-input" placeholder="Folder name" />
            <input id="folderTarget" class="modal-input" placeholder="Target (optional)" />
            <div class="modal-actions">
                <button onclick="hideAddFolderDialog()" class="btn-cancel">Cancel</button>
                <button onclick="submitAddFolder()" class="btn-create">Create</button>
            </div>
            <div id="addFolderMsg" class="modal-status-msg"></div>
        </div>
    </div>
    
    <div id="deleteConfirmModal" class="modal-overlay">
        <div class="modal-content modal-content-wide">
            <h2 class="modal-title">Delete File</h2>
            <div id="deleteMsg" class="modal-body-text">Are you sure you want to delete this file?</div>
            <div class="modal-actions">
                <button onclick="hideDeleteDialog()" class="btn-cancel">Cancel</button>
                <button id="confirmDeleteBtn" onclick="submitDelete()" class="btn-confirm-delete">Delete</button>
            </div>
        </div>
    </div>
</body>
</html>
